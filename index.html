<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="A private, local-first personal knowledge system.">
<link rel="manifest" href="manifest.webmanifest">
<title>Second Brain</title>
<style>
:root{--bg:#0b1220;--panel:#111c2e;--panel2:#16243a;--line:#263750;--text:#edf4ff;--muted:#91a4bd;--blue:#69b7ff;--cyan:#69e0d0;--gold:#f5c66b;--red:#ff8181;--shadow:0 18px 50px #0005}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1000px 600px at 85% -10%,#1b3555 0%,transparent 55%),var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:24px 16px;background:#0c1626d9;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px}.brand{display:flex;gap:11px;align-items:center;padding:0 8px}.logo{width:39px;height:39px;border-radius:13px;background:linear-gradient(135deg,#55a9ff,#5ce0d0);display:grid;place-items:center;color:#081526;font-size:22px;font-weight:900}.brand strong{display:block;font-size:15px;letter-spacing:.08em}.brand small{color:var(--muted);font-size:11px}.nav{display:grid;gap:5px}.nav button,.side-action{background:transparent;color:var(--muted);border:0;text-align:left;padding:11px 12px;border-radius:10px;display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover,.side-action:hover{background:var(--panel2);color:var(--text)}.nav .ico{width:20px;text-align:center}.side-bottom{margin-top:auto;display:grid;gap:8px}.local{border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--muted);font-size:12px}.local b{color:var(--cyan);display:block;margin-bottom:3px}
main{min-width:0;padding:30px clamp(18px,4vw,54px) 70px;max-width:1500px;width:100%;margin:0 auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:26px}.eyebrow{color:var(--cyan);font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}.top h1{font-size:clamp(26px,4vw,36px);margin:4px 0 0;letter-spacing:-.04em}.top-actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px 14px;border-radius:10px}.btn.primary{background:linear-gradient(135deg,#3d93e6,#35bfb0);border:0;color:#061626;font-weight:750}.btn.danger{color:var(--red)}.btn.small{padding:7px 10px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:15px}.card{background:linear-gradient(160deg,#142239,#101a2b);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:var(--shadow);min-width:0}.stat{grid-column:span 3}.stat .num{font-size:29px;font-weight:750;letter-spacing:-.04em;margin-top:7px}.stat .label{color:var(--muted);font-size:12px}.stat .hint{color:var(--cyan);font-size:11px;margin-top:5px}.wide{grid-column:span 8}.narrow{grid-column:span 4}.half{grid-column:span 6}.full{grid-column:span 12}.card h2{font-size:15px;margin:0 0 14px}.muted{color:var(--muted)}.quick{display:flex;gap:8px;flex-wrap:wrap}.quick button{flex:1;min-width:130px;text-align:left;padding:13px;border-radius:12px;border:1px solid var(--line);background:#15253b;color:var(--text)}.quick button span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.item{padding:12px 0;border-bottom:1px solid #263750}.item:last-child{border:0}.item-title{font-weight:650}.item-meta{font-size:11px;color:var(--muted);margin-top:3px}.pill{display:inline-block;border:1px solid var(--line);padding:2px 8px;border-radius:30px;color:var(--muted);font-size:10px;margin:2px 4px 2px 0}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:5px 0 18px}.section-head h2{font-size:22px;margin:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.field{width:100%;background:#0b1524;border:1px solid var(--line);color:var(--text);padding:11px 12px;border-radius:10px;outline:none}.field:focus{border-color:var(--blue)}textarea.field{min-height:180px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid .fullfield{grid-column:1/-1}.note-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.note-row button{flex-shrink:0}.empty{padding:32px 15px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:13px}.empty strong{display:block;color:var(--text);margin-bottom:5px}.searchbar{max-width:520px;width:100%}.tag{color:var(--cyan)}.graph{width:100%;height:380px;background:#0b1524;border:1px solid var(--line);border-radius:13px}.assistantbox{display:grid;gap:12px}.answer{white-space:pre-wrap;background:#0b1524;border:1px solid var(--line);border-radius:12px;padding:14px;min-height:90px;color:#dceaff}.modal{position:fixed;inset:0;background:#030811c9;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.show{display:flex}.dialog{width:min(720px,100%);max-height:90vh;overflow:auto;background:#111e31;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.dialog h2{margin:0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#dffbf5;color:#09211e;padding:10px 16px;border-radius:30px;display:none;z-index:10;font-weight:650}.toast.show{display:block}.mobile-head{display:none}
@media(max-width:850px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:4;top:auto;bottom:0;height:auto;width:100%;padding:7px 8px calc(7px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);background:#0b1424f5}.brand,.side-bottom,.nav-label,.local{display:none}.nav{display:flex;justify-content:space-around;gap:2px}.nav button{flex:1;justify-content:center;flex-direction:column;gap:1px;padding:7px 2px;font-size:10px}.nav .ico{font-size:17px}.app main{padding:22px 15px 105px}.stat{grid-column:span 6}.wide,.narrow,.half{grid-column:span 12}.top{align-items:flex-start}.top-actions .btn{padding:8px 10px;font-size:12px}.formgrid{grid-template-columns:1fr}.formgrid .fullfield{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
 <div class="brand"><div class="logo">✳</div><div><strong>SECOND BRAIN</strong><small>PERSONAL KNOWLEDGE OS</small></div></div>
 <nav class="nav" id="nav">
  <button class="active" data-page="home"><span class="ico">⌂</span><span class="nav-label">Overview</span></button>
  <button data-page="notes"><span class="ico">▤</span><span class="nav-label">Knowledge</span></button>
  <button data-page="projects"><span class="ico">◫</span><span class="nav-label">Projects</span></button>
  <button data-page="journal"><span class="ico">▧</span><span class="nav-label">Journal</span></button>
  <button data-page="assistant"><span class="ico">✧</span><span class="nav-label">AI Search</span></button>
  <button data-page="graph"><span class="ico">◎</span><span class="nav-label">Graph</span></button>
  <button data-page="settings"><span class="ico">⚙</span><span class="nav-label">Settings</span></button>
 </nav>
 <div class="side-bottom">
  <div class="local"><b>● LOCAL-FIRST</b>Your notes stay in this browser unless you export or share them.</div>
  <button class="side-action" id="exportSide">⇩ Export backup</button>
 </div>
</aside>
<main>
 <div class="top"><div><div class="eyebrow" id="eyebrow">YOUR PERSONAL KNOWLEDGE SYSTEM</div><h1 id="pageTitle">Good to see you.</h1></div><div class="top-actions"><button class="btn" id="globalSearchBtn">⌕ Search</button><button class="btn primary" id="newBtn">＋ Capture</button></div></div>
 <div id="view"></div>
</main>
</div>
<div class="modal" id="modal"><div class="dialog"><div class="dialog-head"><h2 id="modalTitle">New note</h2><button class="btn small" id="closeModal">✕</button></div><div id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY='secondBrain.v1';
const starter=[
{id:uid(),title:'Welcome to your Second Brain',body:'This is your private knowledge workspace. Capture ideas, create projects, keep a daily journal, and connect related notes with links using [[Note title]].\\n\\nStart by editing or deleting this note.',category:'Personal',tags:['welcome','guide'],links:[],created:new Date().toISOString(),updated:new Date().toISOString(),pinned:true},
{id:uid(),title:'Shopify store — operating notes',body:'Track store setup, products, customer support, marketing experiments, and weekly results here. Add decisions and next actions as they happen.',category:'Business',tags:['shopify','business'],links:[],created:new Date().toISOString(),updated:new Date().toISOString()},
{id:uid(),title:'Robot dog — project notebook',body:'Use this note to track hardware, software, sensors, experiments, safety checks, and build decisions for the search-and-rescue robot project.',category:'Projects',tags:['robotics','engineering'],links:[],created:new Date().toISOString(),updated:new Date().toISOString()}
];
function uid(){return 'n'+Math.random().toString(36).slice(2,10)}
let state=load(),page='home',editing=null,searchTerm='';
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.notes))return x}catch(e){}return {notes:starter,projects:[],journal:[],settings:{name:'',theme:'dark'}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function date(s){try{return new Date(s).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}catch(e){return ''}}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function setPage(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});
document.getElementById('newBtn').onclick=()=>openEditor();
document.getElementById('closeModal').onclick=closeModal;
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
document.getElementById('globalSearchBtn').onclick=()=>{setPage('notes');setTimeout(()=>document.getElementById('searchInput')?.focus(),50)};
document.getElementById('exportSide').onclick=exportBackup;
function closeModal(){document.getElementById('modal').classList.remove('show')}
function showModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('show')}
function openEditor(note=null){
 editing=note?.id||null;
 showModal(note?'Edit knowledge':'Capture knowledge',`
 <form id="noteForm"><div class="formgrid">
 <div class="fullfield"><label>Title</label><input class="field" name="title" required maxlength="120" value="${esc(note?.title||'')}" placeholder="Give this a clear title"></div>
 <div><label>Area</label><select class="field" name="category">${['Personal','Business','Projects','Education','Ideas','Research','Other'].map(x=>`<option ${note?.category===x?'selected':''}>${x}</option>`).join('')}</select></div>
 <div><label>Tags (comma separated)</label><input class="field" name="tags" value="${esc((note?.tags||[]).join(', '))}" placeholder="idea, learning, priority"></div>
 <div class="fullfield"><label>Content</label><textarea class="field" name="body" placeholder="Write your thoughts, decisions, links, or lessons...">${esc(note?.body||'')}</textarea></div>
 </div><div class="toolbar" style="justify-content:flex-end;margin-top:14px"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save note</button></div></form>`);
 document.getElementById('noteForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),now=new Date().toISOString();let n={id:editing||uid(),title:f.get('title').trim(),body:f.get('body'),category:f.get('category'),tags:f.get('tags').split(',').map(x=>x.trim()).filter(Boolean),links:extractLinks(f.get('body')),created:note?.created||now,updated:now,pinned:note?.pinned||false};if(editing)state.notes=state.notes.map(x=>x.id===editing?n:x);else state.notes.unshift(n);save();closeModal();render();toast('Saved to your brain')};
}
function extractLinks(body){return [...String(body).matchAll(/\[\[([^\]]+)\]\]/g)].map(m=>m[1])}
function noteCard(n){return `<div class="item"><div class="note-row"><div style="min-width:0"><div class="item-title">${n.pinned?'📌 ':''}${esc(n.title)}</div><div class="item-meta">${esc(n.category)} · Updated ${date(n.updated)}</div><div style="margin-top:5px">${(n.tags||[]).map(t=>`<span class="pill">#${esc(t)}</span>`).join('')}</div><div class="muted" style="font-size:12px;margin-top:7px">${esc((n.body||'').slice(0,155))}${(n.body||'').length>155?'…':''}</div></div><div class="toolbar"><button class="btn small" onclick="openEditor(state.notes.find(x=>x.id==='${n.id}'))">Edit</button><button class="btn small" onclick="togglePin('${n.id}')">${n.pinned?'Unpin':'Pin'}</button></div></div></div>`}
function togglePin(id){let n=state.notes.find(x=>x.id===id);if(n)n.pinned=!n.pinned;save();render()}
function render(){
let v=document.getElementById('view'),title=document.getElementById('pageTitle'),ey=document.getElementById('eyebrow');
let notes=state.notes,projects=state.projects,journal=state.journal;
if(page==='home'){title.textContent=state.settings.name?`Welcome back, ${esc(state.settings.name)}.`:'Your second brain.';ey.textContent='YOUR PERSONAL KNOWLEDGE SYSTEM';
v.innerHTML=`<div class="grid">
<div class="card stat"><div class="label">KNOWLEDGE NOTES</div><div class="num">${notes.length}</div><div class="hint">Your growing library</div></div>
<div class="card stat"><div class="label">ACTIVE PROJECTS</div><div class="num">${projects.filter(p=>p.status!=='Done').length}</div><div class="hint">Things in motion</div></div>
<div class="card stat"><div class="label">JOURNAL ENTRIES</div><div class="num">${journal.length}</div><div class="hint">Days documented</div></div>
<div class="card stat"><div class="label">CONNECTED LINKS</div><div class="num">${notes.reduce((a,n)=>a+(n.links||[]).length,0)}</div><div class="hint">Ideas connected</div></div>
<div class="card full"><h2>Quick capture</h2><div class="quick"><button onclick="openEditor()">✎ New note<span>Save a thought or piece of knowledge</span></button><button onclick="openProject()">◫ New project<span>Define an outcome and next action</span></button><button onclick="newJournal()">▧ Daily journal<span>Record today's progress</span></button><button onclick="setPage('assistant')">✧ Ask your brain<span>Search your saved knowledge</span></button></div></div>
<div class="card wide"><h2>Recently updated</h2>${notes.slice().sort((a,b)=>b.updated.localeCompare(a.updated)).slice(0,5).map(noteCard).join('')||empty('No notes yet','Capture your first idea.')}</div>
<div class="card narrow"><h2>Focus areas</h2>${['Personal','Business','Projects','Education','Ideas','Research'].map(c=>`<div class="item"><div class="note-row"><span>${c}</span><b>${notes.filter(n=>n.category===c).length}</b></div></div>`).join('')}</div>
<div class="card full"><h2>Getting started</h2><p class="muted">Capture knowledge, link related notes with <code>[[double brackets]]</code>, and use Graph to explore connections. Your data is stored locally in this browser.</p><div class="toolbar"><button class="btn" onclick="setPage('settings')">Set up & backup</button><button class="btn" onclick="setPage('graph')">Explore graph</button></div></div>
</div>`}
if(page==='notes'){title.textContent='Knowledge library';ey.textContent='CAPTURE · CONNECT · RETRIEVE';v.innerHTML=`<div class="section-head"><h2>All knowledge</h2><button class="btn primary" onclick="openEditor()">＋ New note</button></div><input class="field searchbar" id="searchInput" placeholder="Search titles, content, tags..." value="${esc(searchTerm)}"><div id="noteList" class="card" style="margin-top:15px">${renderNoteList(notes)}</div>`;document.getElementById('searchInput').oninput=e=>{searchTerm=e.target.value;document.getElementById('noteList').innerHTML=renderNoteList(filteredNotes())}}
if(page==='projects'){title.textContent='Projects';ey.textContent='TURN PLANS INTO PROGRESS';v.innerHTML=`<div class="section-head"><h2>Project tracker</h2><button class="btn primary" onclick="openProject()">＋ New project</button></div><div class="grid">${projects.map((p,i)=>`<div class="card half"><div class="note-row"><h2>${esc(p.title)}</h2><span class="pill">${esc(p.status)}</span></div><p class="muted">${esc(p.description)}</p><div class="item-meta">Priority: ${esc(p.priority)} · Created ${date(p.created)}</div><div class="toolbar" style="margin-top:12px"><button class="btn small" onclick="cycleProject('${p.id}')">Update status</button><button class="btn small danger" onclick="deleteProject('${p.id}')">Delete</button></div></div>`).join('')||`<div class="card full">${empty('No projects yet','Create a project to track a goal, build or experiment.')}</div>`}</div>`}
if(page==='journal'){title.textContent='Daily journal';ey.textContent='REFLECT · LEARN · IMPROVE';v.innerHTML=`<div class="section-head"><h2>Your entries</h2><button class="btn primary" onclick="newJournal()">＋ Today's entry</button></div><div class="card">${journal.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(j=>`<div class="item"><div class="item-title">${esc(j.date)}</div><p class="muted">${esc(j.body.slice(0,250))}</p><button class="btn small" onclick="editJournal('${j.id}')">Edit</button></div>`).join('')||empty('Your journal starts here','Record a win, a lesson and tomorrow’s priority.')}</div>`}
if(page==='assistant'){title.textContent='Ask your knowledge';ey.textContent='LOCAL SEARCH ASSISTANT';v.innerHTML=`<div class="card assistantbox"><h2>Ask a question about what you've saved</h2><p class="muted">This starter uses local keyword and tag retrieval. It does not invent answers or call a cloud AI. Add an AI model later for generated responses.</p><input class="field" id="askInput" placeholder="e.g. What have I written about Shopify?"><div class="toolbar"><button class="btn primary" onclick="askBrain()">Search my brain</button><button class="btn" onclick="document.getElementById('askInput').value='What projects am I tracking?';askBrain()">Show my projects</button></div><div class="answer" id="answer">Your retrieved notes will appear here.</div></div>`;document.getElementById('askInput').addEventListener('keydown',e=>{if(e.key==='Enter')askBrain()})}
if(page==='graph'){title.textContent='Knowledge graph';ey.textContent='SEE HOW YOUR IDEAS CONNECT';v.innerHTML=`<div class="card"><h2>Note connections</h2><p class="muted">Connections are created when a note contains a matching [[Note title]] link. This graph is generated locally.</p><canvas id="graphCanvas" class="graph"></canvas><div class="item-meta">${notes.length} notes · ${notes.reduce((a,n)=>a+(n.links||[]).length,0)} outgoing links</div></div>`;drawGraph()}
if(page==='settings'){title.textContent='Settings & portability';ey.textContent='YOUR DATA · YOUR CONTROL';v.innerHTML=`<div class="grid"><div class="card half"><h2>Profile</h2><label class="muted">What should the dashboard call you?</label><input class="field" id="nameInput" value="${esc(state.settings.name||'')}" placeholder="Your name" style="margin:8px 0"><button class="btn primary" onclick="state.settings.name=document.getElementById('nameInput').value.trim();save();render();toast('Profile saved')">Save profile</button></div><div class="card half"><h2>Data backup</h2><p class="muted">Export all notes, projects and journal entries as a JSON backup. Import it on another device to restore your data.</p><div class="toolbar"><button class="btn primary" onclick="exportBackup()">⇩ Export backup</button><button class="btn" onclick="document.getElementById('importFile').click()">⇧ Import backup</button><input id="importFile" type="file" accept=".json,application/json" hidden></div></div><div class="card full"><h2>Device sync</h2><p class="muted">This build stores data in the browser on each device. It does not automatically sync between your MacBook and iPhone. For private automatic sync, add a sync service or deploy a secure backend. For now, use Export on one device and Import on the other.</p><h2 style="margin-top:20px">Install as an app</h2><p class="muted">On Mac: open the hosted app in Safari and use File → Add to Dock (or Share → Add to Dock, depending on macOS). On iPhone: open the hosted HTTPS app in Safari → Share → Add to Home Screen. A downloaded ZIP alone cannot install a PWA; it needs to be served from an HTTPS website.</p></div><div class="card full"><h2>Privacy & limits</h2><p class="muted">Your notes stay in this browser's local storage. Clearing website data can erase them, so export backups regularly. This starter has local search, project tracking, journaling and a visual graph. Cloud AI, background automation and cross-device sync are not connected yet.</p><button class="btn danger" onclick="if(confirm('Delete all local Second Brain data in this browser? Export a backup first.')){localStorage.removeItem(KEY);state=load();render();toast('Local data reset')}">Reset this browser's data</button></div></div>`;
document.getElementById('importFile').onchange=importBackup}
}
function empty(a,b){return `<div class="empty"><strong>${a}</strong>${b}</div>`}
function filteredNotes(){let q=searchTerm.toLowerCase().trim();if(!q)return state.notes;return state.notes.filter(n=>(n.title+' '+n.body+' '+n.category+' '+(n.tags||[]).join(' ')).toLowerCase().includes(q))}
function renderNoteList(arr){return arr.slice().sort((a,b)=>b.updated.localeCompare(a.updated)).map(noteCard).join('')||empty('Nothing found','Try another search or create a note.')}
function openProject(){showModal('Create project',`<form id="projectForm"><div class="formgrid"><div class="fullfield"><label>Project name</label><input class="field" name="title" required placeholder="e.g. Launch a new store"></div><div><label>Priority</label><select class="field" name="priority"><option>High</option><option selected>Medium</option><option>Low</option></select></div><div><label>Status</label><select class="field" name="status"><option>Planning</option><option selected>Active</option><option>Paused</option></select></div><div class="fullfield"><label>Outcome / description</label><textarea class="field" name="description" placeholder="What does success look like?"></textarea></div></div><div style="text-align:right;margin-top:14px"><button class="btn primary">Create project</button></div></form>`);document.getElementById('projectForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);state.projects.push({id:uid(),title:f.get('title'),priority:f.get('priority'),status:f.get('status'),description:f.get('description'),created:new Date().toISOString()});save();closeModal();render();toast('Project created')}}
function cycleProject(id){let p=state.projects.find(x=>x.id===id);if(p){let a=['Planning','Active','Paused','Done'];p.status=a[(a.indexOf(p.status)+1)%a.length];save();render()}}
function deleteProject(id){if(confirm('Delete this project?')){state.projects=state.projects.filter(p=>p.id!==id);save();render()}}
function newJournal(existing=null){let today=new Date().toISOString().slice(0,10),j=existing||state.journal.find(x=>x.date===today);showModal(j?'Edit journal entry':'Daily reflection',`<form id="journalForm"><label>Date</label><input class="field" name="date" type="date" value="${j?.date||today}"><label style="display:block;margin-top:10px">What happened, what did you learn, and what's next?</label><textarea class="field" name="body" placeholder="Today's wins, challenges, ideas and priorities...">${esc(j?.body||'')}</textarea><div style="text-align:right;margin-top:12px"><button class="btn primary">Save journal</button></div></form>`);document.getElementById('journalForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),entry={id:j?.id||uid(),date:f.get('date'),body:f.get('body')};state.journal=state.journal.filter(x=>x.id!==entry.id&&x.date!==entry.date);state.journal.unshift(entry);save();closeModal();render();toast('Journal saved')}}
function editJournal(id){newJournal(state.journal.find(x=>x.id===id))}
function askBrain(){let q=document.getElementById('askInput').value.trim().toLowerCase(),out=document.getElementById('answer');if(!q){out.textContent='Enter a question or keywords to search.';return}let terms=q.split(/\W+/).filter(x=>x.length>2),scored=state.notes.map(n=>{let text=(n.title+' '+n.body+' '+n.category+' '+(n.tags||[]).join(' ')).toLowerCase(),score=terms.reduce((s,t)=>s+(text.includes(t)?(n.title.toLowerCase().includes(t)?4:1):0),0);return {n,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);let proj=state.projects.filter(p=>(p.title+' '+p.description+' '+p.status).toLowerCase().split(/\W+/).some(t=>terms.includes(t)));if(!scored.length&&!proj.length){out.textContent='I could not find matching saved information. Try different keywords or capture a note first.';return}out.textContent=(scored.length?'MATCHING NOTES\\n'+scored.slice(0,6).map(x=>'• '+x.n.title+' ['+x.n.category+']\\n  '+x.n.body.slice(0,400)).join('\\n\\n'):'')+(proj.length?'\\n\\nPROJECTS\\n'+proj.map(p=>'• '+p.title+' — '+p.status+': '+p.description).join('\\n'):'')+'\\n\\nRetrieved from your local Second Brain. This is search, not a generated AI answer.'}
function drawGraph(){let c=document.getElementById('graphCanvas');if(!c)return;let rect=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=rect.width*dpr;c.height=rect.height*dpr;let x=c.getContext('2d');x.scale(dpr,dpr);let w=rect.width,h=rect.height,N=state.notes.length;if(!N){return}let nodes=state.notes.map((n,i)=>({n,x:w/2+Math.cos(i*2*Math.PI/N)*Math.min(w,h)*.34,y:h/2+Math.sin(i*2*Math.PI/N)*Math.min(w,h)*.34}));let byTitle=new Map(nodes.map(o=>[o.n.title.toLowerCase(),o]));x.strokeStyle='#42617f';x.lineWidth=1;nodes.forEach(a=>(a.n.links||[]).forEach(l=>{let b=byTitle.get(l.toLowerCase());if(b){x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}));nodes.forEach(o=>{x.beginPath();x.arc(o.x,o.y,6,0,Math.PI*2);x.fillStyle='#68c8df';x.fill();x.fillStyle='#e6f2ff';x.font='12px sans-serif';x.fillText(o.n.title.slice(0,24),o.x+10,o.y-9)})}
function exportBackup(){let blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='second-brain-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported')}
function importBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.notes)||!Array.isArray(x.projects)||!Array.isArray(x.journal))throw Error();if(!confirm('Import backup and replace the data in this browser?'))return;state=x;save();render();toast('Backup imported')}catch(err){alert('That file is not a valid Second Brain backup.')}};r.readAsText(f);e.target.value=''}
window.addEventListener('resize',()=>{if(page==='graph')drawGraph()});
if(!localStorage.getItem(KEY))save();
render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
